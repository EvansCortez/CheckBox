<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Wish List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Apple Wish List</h1>
        <p>Check off what you already have. Click a picture to learn more.</p>
    </header>

    <div id="list">

        <div class="row">
            <input type="checkbox" aria-label="iPhone">
            <a href="https://www.apple.com/iphone/" target="_blank"><img src="images/iphone.jpg" alt="iPhone"></a>
            <input type="text" value="iPhone">
        </div>

        <div class="row">
            <input type="checkbox" aria-label="iPad">
            <a href="https://www.apple.com/ipad/" target="_blank"><img src="images/ipad.jpg" alt="iPad"></a>
            <input type="text" value="iPad">
        </div>

        <div class="row">
            <input type="checkbox" aria-label="MacBook">
            <a href="https://www.apple.com/mac/" target="_blank"><img src="images/macbook.jpg" alt="MacBook"></a>
            <input type="text" value="MacBook">
        </div>

        <div class="row">
            <input type="checkbox" aria-label="Apple Watch">
            <a href="https://www.apple.com/watch/" target="_blank"><img src="images/watch.png" alt="Apple Watch"></a>
            <input type="text" value="Apple Watch">
        </div>

        <div class="row">
            <input type="checkbox" aria-label="AirPods">
            <a href="https://www.apple.com/airpods/" target="_blank"><img src="images/airpods.jpg" alt="AirPods"></a>
            <input type="text" value="AirPods">
        </div>

        <div class="row">
            <input type="checkbox" aria-label="iMac">
            <a href="https://www.apple.com/imac/" target="_blank"><img src="images/imac.jpg" alt="iMac"></a>
            <input type="text" value="iMac">
        </div>

    </div>

</body>
</html>
